services:
  netpulse:
    build: .
    network_mode: host
    command: ["uvicorn", "netpulse.main:app", "--host", "127.0.0.1", "--port", "8010"]
    environment:
      DATABASE_PATH: /data/netpulse.db
      MONITOR_INTERVAL_SECONDS: "30"
    volumes:
      - netpulse-data:/data

volumes:
  netpulse-data:
